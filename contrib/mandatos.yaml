# Regras de mandato do Executivo que o TSE não publica: datas de posse e de fim.
# Fonte: Emenda Constitucional 111/2021 (art. 4º e nova redação dos arts. 28 e 82 da Constituição).

# Mandato presidencial de 2019 a 2023 (ADR-0009): posse em 1º de janeiro pelo art. 82 na redação da EC 16/1997;
# o fim é a posse do sucessor em 1º de janeiro de 2023 (EC 111/2021, art. 4º, regra abaixo).
- cargo: presidente
  eleicao: 2018
  inicio: 2019-01-01
  fim: 2023-01-01
  texto_oficial: "Art. 82. O mandato do Presidente da República é de quatro anos e terá início em primeiro de janeiro do ano seguinte ao da sua eleição."
  fonte_id: planalto-legislacao
  url_origem: https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc16.htm
  snapshot_url: https://web.archive.org/web/20261024225215/https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc16.htm
  capturado_em: 2026-11-02T18:40:00Z
  contribuidor: viniciusdsandrade

- cargo: presidente
  eleicao: 2022
  inicio: 2023-01-01
  fim: 2027-01-05
  texto_oficial: "Art. 4º O Presidente da República e os Governadores de Estado e do Distrito Federal eleitos em 2022 tomarão posse em 1º de janeiro de 2023, e seus mandatos durarão até a posse de seus sucessores, em 5 e 6 de janeiro de 2027, respectivamente."
  fonte_id: planalto-legislacao
  url_origem: https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc111.htm
  snapshot_url: https://web.archive.org/web/20261023091924/https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc111.htm
  capturado_em: 2026-10-30T02:55:00Z
  contribuidor: viniciusdsandrade

- cargo: governador
  eleicao: 2022
  inicio: 2023-01-01
  fim: 2027-01-06
  texto_oficial: "Art. 4º O Presidente da República e os Governadores de Estado e do Distrito Federal eleitos em 2022 tomarão posse em 1º de janeiro de 2023, e seus mandatos durarão até a posse de seus sucessores, em 5 e 6 de janeiro de 2027, respectivamente."
  fonte_id: planalto-legislacao
  url_origem: https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc111.htm
