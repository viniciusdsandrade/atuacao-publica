# Posse da vice-governadora no governo do Pará, com a renúncia do titular (ADR-0074).
- tipo: mandato
  data: 2026-04-02
  cargo: governador
  inicio: 2026-04-02
  fim: 2027-01-06
  situacao: "Governadora em exercício desde 2026-04-02, com a renúncia do titular"
  texto_oficial: "O agora ex-governador Helder Barbalho (MDB) formalizou a renúncia ao cargo de chefe do Executivo estadual ao assinar e encaminhar a mensagem oficial ao Poder Legislativo durante cerimônia realizada nesta quinta-feira, 2 de abril, no Hangar Convenções e Feiras da Amazônia, em Belém. [...] Após a formalização da renúncia e a transmissão de cargo, Hana Ghassan assumiu oficialmente o governo do Pará e apresentou as prioridades da nova fase administrativa."
