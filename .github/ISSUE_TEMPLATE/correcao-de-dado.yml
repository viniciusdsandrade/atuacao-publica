name: Correção de dado
description: Um dado publicado está diferente da fonte oficial.
title: "Correção: <perfil> / <campo>"
labels: ["correcao"]
body:
  - type: markdown
    attributes:
      value: |
        Use este modelo para pedir correção de um dado publicado. A assessoria do político usa o mesmo modelo.
        Não escreva CPF, telefone, e-mail pessoal ou endereço.
  - type: input
    id: perfil
    attributes:
      label: Perfil
      description: Identificador ou URL do perfil (por exemplo, cam-204554).
    validations:
      required: true
  - type: input
    id: campo
    attributes:
      label: Campo
      description: Bloco e campo com erro (por exemplo, mandatos / fim).
    validations:
      required: true
  - type: textarea
    id: valor_atual
    attributes:
      label: Valor atual
      description: O que o site mostra hoje.
    validations:
      required: true
  - type: textarea
    id: valor_correto
    attributes:
      label: Valor correto
      description: O que a fonte oficial diz.
    validations:
      required: true
  - type: input
    id: fonte
    attributes:
      label: URL da fonte oficial
      description: Página de fonte T0 (órgão público) que comprova o valor correto.
    validations:
      required: true
  - type: input
    id: snapshot
    attributes:
      label: Snapshot arquivado (opcional)
      description: URL em web.archive.org ou archive.today.
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: A fonte é oficial (órgão público), não imprensa nem rede social de terceiros.
          required: true
        - label: O pedido não contém dado pessoal (CPF, telefone, e-mail pessoal, endereço).
          required: true
