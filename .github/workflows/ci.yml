name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacidade:
    name: segredos e privacidade
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks no histórico
        env:
          VERSAO: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: padrões de privacidade
        env:
          # Segredo opcional com uma regex por linha. Sem ele, valem só os padrões genéricos.
          PADROES: ${{ secrets.PRIVACY_PATTERNS }}
        run: |
          printf '%s\n' "$PADROES" > "$RUNNER_TEMP/padroes"
          PRIVACY_PATTERNS_FILE="$RUNNER_TEMP/padroes" scripts/privacy-check.sh

  etl:
    name: etl (build e testes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: build e testes (inclui exemplos dos schemas)
        working-directory: etl
        run: ./mvnw -B -ntp verify
      - name: valida contrib (schema, allowlist, domínio, dado pessoal)
        run: java -jar etl/target/etl.jar normalize contrib
      - name: confere URLs de contrib
        if: github.event_name == 'pull_request'
        run: java -jar etl/target/etl.jar fetch contrib

  web:
    name: web (build, testes, E2E e acessibilidade)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: dependências
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: testes unitários
        working-directory: web
        run: npm test
      - name: build
        working-directory: web
        run: npm run build
      - name: navegador dos testes E2E
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E e acessibilidade (WCAG 2.1 AA)
        # Dados sintéticos servidos por web/e2e/servidor.mjs. Nenhuma chamada a terceiros (ADR-0028).
        working-directory: web
        run: npx playwright test
      - name: relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
