name: dados

# Coleta, normaliza e publica os dados; monta o site com os JSON publicados.
# O agendamento só roda com a variável ETL_AGENDADO = true, e o deploy só com PUBLICAR_PAGES = true
# (docs/MAINTAINER_CHECKLIST.md). Sem as variáveis, só o disparo manual roda, e sem deploy.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      fonte:
        description: Fonte a coletar. As demais seguem do cache de dados brutos.
        type: choice
        options: [todas, camara, senado, tse, executivo, sapl, tcesp, cgu, agenda, contrib, alesp, executivosp, almg, alep, alba, alerj, alrs, alece, alesc, alego, ales, alepa, alepe, cldf, almt, cmsp]
        default: todas

permissions:
  contents: read

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  etl:
    name: coleta, publicação e site
    if: github.event_name == 'workflow_dispatch' || vars.ETL_AGENDADO == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    env:
      FONTE: ${{ inputs.fonte || 'todas' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: restaura dados brutos e cursores
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/publicado/_meta
            data/publicado/index.json
          key: dados-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dados-
      - name: semente da coleta local para ALMG, ALRS, ALES, ALEPE, CLDF e ALBA
        # Essas casas recusam conexão de fora do Brasil; na ALBA, a API de proposições responde 403 ao runner.
        # O mantenedor coleta na rede dele e envia o cache cifrado (ADR-0034). Sem o segredo, o passo não faz nada.
        # As casas restauradas pulam a coleta abaixo.
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          SEMENTE_CHAVE: ${{ secrets.SEMENTE_CHAVE }}
        run: scripts/semente-restaurar.sh
      - name: build do ETL
        working-directory: etl
        run: ./mvnw -B -ntp -q package -DskipTests
      - name: túnel pelo Brasil para ALMG, ALRS, ALES e CLDF
        # Esses sites recusam conexão de fora do país (ADR-0029). Sem os segredos, o passo não faz nada.
        if: env.FONTE == 'todas' || env.FONTE == 'almg' || env.FONTE == 'alrs' || env.FONTE == 'ales' || env.FONTE == 'cldf'
        continue-on-error: true
        timeout-minutes: 3
        env:
          TUNEL_SSH_DESTINO: ${{ secrets.TUNEL_SSH_DESTINO }}
          TUNEL_SSH_CHAVE: ${{ secrets.TUNEL_SSH_CHAVE }}
          TUNEL_SSH_KNOWN_HOSTS: ${{ secrets.TUNEL_SSH_KNOWN_HOSTS }}
        run: scripts/tunel-brasil.sh
      # Um passo por fonte, cada um com limite de tempo: fonte lenta não consome o tempo das outras.
      # ETL_ORCAMENTO_MINUTOS fica abaixo do limite do passo: esgotado, o restante vem do cache, a fonte fica parcial,
      # e o cursor e o cache são gravados. Falha ou limite estourado não derruba o job.
      - name: fetch tse
        if: env.FONTE == 'todas' || env.FONTE == 'tse'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx4g -jar etl/target/etl.jar fetch tse
      - name: fetch executivo
        if: env.FONTE == 'todas' || env.FONTE == 'executivo'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ETL_ORCAMENTO_MINUTOS: '7'
        run: java -Xmx4g -jar etl/target/etl.jar fetch executivo
      - name: fetch senado
        if: env.FONTE == 'todas' || env.FONTE == 'senado'
        continue-on-error: true
        timeout-minutes: 30
        env:
          ETL_ORCAMENTO_MINUTOS: '22'
        run: java -Xmx4g -jar etl/target/etl.jar fetch senado
      - name: fetch camara
        if: env.FONTE == 'todas' || env.FONTE == 'camara'
        continue-on-error: true
        timeout-minutes: 90
        env:
          ETL_ORCAMENTO_MINUTOS: '75'
        run: java -Xmx4g -jar etl/target/etl.jar fetch camara
      - name: fetch sapl
        # Câmara municipal do piloto: cerca de mil chamadas na primeira carga, renovadas em rodízio semanal.
        if: env.FONTE == 'todas' || env.FONTE == 'sapl'
        continue-on-error: true
        timeout-minutes: 90
        env:
          ETL_ORCAMENTO_MINUTOS: '75'
        run: java -Xmx4g -jar etl/target/etl.jar fetch sapl
      - name: fetch tcesp
        # Despesas do município do piloto no TCE-SP: um arquivo por mês do mandato, os 6 últimos renovados toda semana.
        if: env.FONTE == 'todas' || env.FONTE == 'tcesp'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx4g -jar etl/target/etl.jar fetch tcesp
      - name: fetch cgu
        # Cartão de pagamento e viagens da Presidência: um ZIP pequeno por mês e um grande por ano, filtrado antes do cache.
        if: env.FONTE == 'todas' || env.FONTE == 'cgu'
        continue-on-error: true
        timeout-minutes: 30
        env:
          ETL_ORCAMENTO_MINUTOS: '22'
        run: java -Xmx4g -jar etl/target/etl.jar fetch cgu
      - name: fetch agenda
        # Agenda da Presidência: uma página por dia do mandato; 2022 vem do Internet Archive, a 4 s por chamada.
        if: env.FONTE == 'todas' || env.FONTE == 'agenda'
        continue-on-error: true
        timeout-minutes: 45
        env:
          ETL_ORCAMENTO_MINUTOS: '35'
        run: java -Xmx2g -jar etl/target/etl.jar fetch agenda
      - name: fetch alesp
        # Assembleia Legislativa do Estado de São Paulo: deputados, despesas de gabinete e comissões.
        if: env.FONTE == 'todas' || env.FONTE == 'alesp'
        continue-on-error: true
        timeout-minutes: 30
        env:
          ETL_ORCAMENTO_MINUTOS: '22'
        run: java -Xmx4g -jar etl/target/etl.jar fetch alesp
      - name: fetch executivosp
        # Poder Executivo do Estado de São Paulo: agenda do Governador e despesas orçamentárias estaduais.
        if: env.FONTE == 'todas' || env.FONTE == 'executivosp'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch executivosp
      - name: fetch almg
        # Assembleia Legislativa do Estado de Minas Gerais: deputados, comissões e verbas indenizatórias.
        if: (env.FONTE == 'todas' || env.FONTE == 'almg') && !contains(env.SEMENTE, ' almg ')
        continue-on-error: true
        timeout-minutes: 30
        env:
          ETL_ORCAMENTO_MINUTOS: '22'
        run: java -Xmx4g -jar etl/target/etl.jar fetch almg
      - name: fetch alep
        # Assembleia Legislativa do Estado do Paraná: deputados, comissões e perfis biográficos.
        if: env.FONTE == 'todas' || env.FONTE == 'alep'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alep
      - name: fetch alba
        # Assembleia Legislativa do Estado da Bahia: deputados, comissões, perfis biográficos, verba indenizatória e
        # proposições. A primeira carga baixa cerca de mil páginas da verba e setecentas da API do NoPaper, a 2 s cada;
        # depois, só o ano aberto renova. Com a semente (ADR-0034), o passo não roda.
        if: (env.FONTE == 'todas' || env.FONTE == 'alba') && !contains(env.SEMENTE, ' alba ')
        continue-on-error: true
        timeout-minutes: 40
        env:
          ETL_ORCAMENTO_MINUTOS: '30'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alba
      - name: fetch alerj
        # Assembleia Legislativa do Estado do Rio de Janeiro: deputados e perfis biográficos.
        if: env.FONTE == 'todas' || env.FONTE == 'alerj'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alerj
      - name: fetch alrs
        # Assembleia Legislativa do Estado do Rio Grande do Sul: deputados em exercício e perfis.
        if: (env.FONTE == 'todas' || env.FONTE == 'alrs') && !contains(env.SEMENTE, ' alrs ')
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alrs
      - name: fetch alece
        # Assembleia Legislativa do Estado do Ceará: deputados em exercício e perfis.
        if: env.FONTE == 'todas' || env.FONTE == 'alece'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alece
      - name: fetch alesc
        # Assembleia Legislativa do Estado de Santa Catarina: deputados em exercício, comissões, perfis, despesas,
        # proposições e votações nominais. A primeira carga das votações baixa cerca de 900 páginas do e-Legis, a cerca de
        # uma por segundo; depois, só as primeiras páginas da lista renovam todo dia, e o ano aberto, por semana.
        if: env.FONTE == 'todas' || env.FONTE == 'alesc'
        continue-on-error: true
        timeout-minutes: 30
        env:
          ETL_ORCAMENTO_MINUTOS: '22'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alesc
      - name: fetch alego
        # Assembleia Legislativa do Estado de Goiás: deputados em exercício, comissões, frentes e perfis.
        if: env.FONTE == 'todas' || env.FONTE == 'alego'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alego
      - name: fetch ales
        # Assembleia Legislativa do Estado do Espírito Santo: 30 deputados, comissões e perfis.
        if: (env.FONTE == 'todas' || env.FONTE == 'ales') && !contains(env.SEMENTE, ' ales ')
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch ales
      - name: fetch alepa
        # Assembleia Legislativa do Estado do Pará: 41 deputados, comissões, perfis e votações nominais desde 2022.
        # A primeira carga das votações baixa cerca de 300 páginas lentas; depois, só o ano aberto renova, por semana.
        if: env.FONTE == 'todas' || env.FONTE == 'alepa'
        continue-on-error: true
        timeout-minutes: 30
        env:
          ETL_ORCAMENTO_MINUTOS: '22'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alepa
      - name: fetch alepe
        # Assembleia Legislativa do Estado de Pernambuco: 49 deputados, comissões e perfis.
        if: (env.FONTE == 'todas' || env.FONTE == 'alepe') && !contains(env.SEMENTE, ' alepe ')
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch alepe
      - name: fetch cldf
        # Câmara Legislativa do Distrito Federal: 24 deputados distritais, comissões e perfis.
        if: (env.FONTE == 'todas' || env.FONTE == 'cldf') && !contains(env.SEMENTE, ' cldf ')
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch cldf
      - name: fetch almt
        # Assembleia Legislativa do Estado de Mato Grosso: 24 deputados estaduais, perfis e Mesa Diretora.
        if: env.FONTE == 'todas' || env.FONTE == 'almt'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch almt
      - name: fetch cmsp
        # Câmara Municipal de São Paulo (segundo município piloto): vereadores em exercício, gabinetes e comissões.
        if: env.FONTE == 'todas' || env.FONTE == 'cmsp'
        continue-on-error: true
        timeout-minutes: 20
        env:
          ETL_ORCAMENTO_MINUTOS: '15'
        run: java -Xmx2g -jar etl/target/etl.jar fetch cmsp
      - name: fetch contrib
        # Confere se as URLs de origem e os snapshots dos registros manuais ainda respondem.
        if: env.FONTE == 'todas' || env.FONTE == 'contrib'
        continue-on-error: true
        timeout-minutes: 10
        env:
          ETL_ORCAMENTO_MINUTOS: '7'
        run: java -jar etl/target/etl.jar fetch contrib
      - name: normalize
        continue-on-error: true
        run: java -Xmx4g -jar etl/target/etl.jar normalize
      - name: publish
        run: java -Xmx4g -jar etl/target/etl.jar publish
      - name: relatório da execução
        run: |
          {
            echo "## Execução do ETL"
            jq -r '"Perfis publicados: \(.publicados). Rejeições: \(.rejeitados | length)."' data/publicado/_meta/execucao.json
            echo
            echo "| Fonte | Status | Última coleta válida |"
            echo "|---|---|---|"
            jq -r '.fontes[] | "| \(.fonte) | \(.status) | \(.ultima_coleta_ok // "-") |"' data/publicado/_meta/execucao.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: alerta de fonte sem coleta válida
        # A falha de uma fonte não derruba o job; sem este passo, ela só apareceria no resumo da execução.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERTA_DIAS: '3'
        run: scripts/alerta-coleta.sh
      - name: site com os dados publicados
        working-directory: web
        env:
          REPOSITORIO: ${{ github.event.repository.name }}
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base-href "/${REPOSITORIO}/"
          cp -R ../data/publicado dist/web/browser/dados
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist/web/browser
      - name: guarda dados brutos e cursores
        # Roda mesmo se um passo falhar ou estourar o limite: a próxima execução reaproveita o que já foi baixado.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/publicado/_meta
            data/publicado/index.json
          key: dados-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    name: deploy no GitHub Pages
    needs: etl
    if: vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
